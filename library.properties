name=MadsUnoAgent
version=0.4.0
author=Paolo Bosetti
maintainer=Paolo Bosetti <paolo.bosetti@unitn.it>
sentence=Minimal direct ZMTP client for the MADS agent framework, targeting Arduino UNO R4 WiFi.
paragraph=Implements just enough of the ZeroMQ ZMTP 3.0 wire protocol (PUB/SUB/REQ) to act as a first-class MADS agent over WiFi: REQ/REP settings retrieval and PUB/SUB messaging against an unmodified mads-broker, with no host PC in between. Optionally speaks CurveZMQ (X25519 + Salsa20/Poly1305) against a broker started with --crypto, enabled at build time and costing nothing when off. JSON payloads only, uncompressed, plus publish-side binary blobs.
category=Communication
url=https://github.com/MADS-NET/arduino_mads
architectures=renesas_uno
includes=MadsUnoAgent.h
depends=ArduinoJson
license=MIT
