name=MadsUnoAgent
version=0.4.0
author=Paolo Bosetti
maintainer=Paolo Bosetti <paolo.bosetti@unitn.it>
sentence=Minimal direct ZMTP client for the MADS agent framework, targeting Arduino UNO R4 WiFi.
paragraph=Implements just enough of the ZeroMQ ZMTP 3.0 wire protocol (NULL security, PUB/SUB/REQ) to act as a first-class MADS agent over WiFi: REQ/REP settings retrieval and PUB/SUB messaging against an unmodified mads-broker. JSON payloads only, uncompressed, plus publish-side binary blobs.
category=Communication
url=https://github.com/mads-net/arduino_mads
architectures=renesas_uno
includes=MadsUnoAgent.h
depends=ArduinoJson
license=MIT
